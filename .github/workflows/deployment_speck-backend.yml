# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - speck-backend

on:
  push:
    branches:
      - deployment
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'

      # Login to Azure using service principal
      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Extract app settings from Azure
      - name: Get App Settings from Azure
        shell: pwsh
        run: |
          $resourceGroup = "MyNodeApp-ResourceGroup" # Replace with your resource group name
          $appSettings = az webapp config appsettings list --name speck-backend --resource-group $resourceGroup | ConvertFrom-Json
          
          # Create a .env file with the settings
          foreach($setting in $appSettings) {
            Add-Content -Path .env -Value "$($setting.name)=$($setting.value)"
            # Also set as environment variable for current process
            echo "Setting environment variable: $($setting.name)"
            echo "$($setting.name)=$($setting.value)" >> $env:GITHUB_ENV
          }

      - name: npm install, build, and test
        run: |
          npm install
          npm run build --if-present
          npm run test --if-present
        # Environment variables are already set from the previous step
      
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'speck-backend'
          slot-name: 'Production'
          package: .
