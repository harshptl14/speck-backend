name: Build and deploy Node.js app to Azure Web App - speck-backend

on:
  push:
    branches:
      - deployment  # Change to 'main' if that’s what Azure expects
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.4.0

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm run build
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Install zip
        run: choco install zip -y
        shell: cmd

      - name: Zip artifact for deployment
        run: zip release.zip ./* -r --symlinks
        shell: cmd

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      id-token: write   # Required for Azure OIDC login
      contents: read    # Required for checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Install unzip
        run: choco install unzip -y
        shell: cmd
      
      - name: Unzip artifact for deployment
        run: unzip release.zip
        shell: cmd

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_16AC696907474106AFCD1C1298C2EDC8 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_4BE358005B864C25A8DDF39AD2E7AFE9 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_4BF31E692ED746D98BF376D0C9C45BCB }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3g
        id: deploy-to-webapp
        with:
          app-name: 'speck-backend'
          slot-name: 'Production'
          package: .