name: Build and deploy Node.js app to Azure Web App - speck-backend

on:
  push:
    branches:
      - deployment
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read # Required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm run build
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # - name: Start
      #   run: pnpm run start
      #   env:
      #     DATABASE_URL: ${{ secrets.DATABASE_URL }}
      #     GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      #     GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      #     GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      #     JWT_SECRET: ${{ secrets.JWT_SECRET }}
      #     MAIN_DOMAIN: ${{ secrets.MAIN_DOMAIN }}
      #     NODE_ENV: ${{ secrets.NODE_ENV }}
      #     OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      #     PORT: ${{ secrets.PORT }}
      #     REDIRECT_URL_FRONTEND: ${{ secrets.REDIRECT_URL_FRONTEND }}
      #     REDIS_URL: ${{ secrets.REDIS_URL }}
      #     SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      #     SOCKET_PORT: ${{ secrets.SOCKET_PORT }}
      #     URL_FRONTEND: ${{ secrets.URL_FRONTEND }}
      #     YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}


      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      id-token: write # Required for requesting the JWT
      contents: read # Required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_16AC696907474106AFCD1C1298C2EDC8 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_4BE358005B864C25A8DDF39AD2E7AFE9 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_4BF31E692ED746D98BF376D0C9C45BCB }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'speck-backend'
          slot-name: 'Production'
          package: .
