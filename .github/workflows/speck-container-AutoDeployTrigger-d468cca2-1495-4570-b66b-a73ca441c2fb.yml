name: Trigger auto deployment for speck-container

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ azure-prod ]
    paths:
    - '**'
    - '.github/workflows/speck-container-AutoDeployTrigger-d468cca2-1495-4570-b66b-a73ca441c2fb.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.SPECKCONTAINER_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.SPECKCONTAINER_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.SPECKCONTAINER_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          registryUrl: 
          registryUsername: ${{ secrets.SPECKCONTAINER_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.SPECKCONTAINER_REGISTRY_PASSWORD }}
          containerAppName: speck-container
          resourceGroup: speck
          imageToBuild: default/[parameters('containerAppName')]:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


